<!DOCTYPE html>
<html lang="en">
<head>
    <!-- No Cache -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HPS ID Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f4f6f8; }
        .banner img { width: 100%; max-height: 200px; object-fit: cover; display: block; }
        .header-bar {
            background: #1a3a5c;
            color: #fff;
            text-align: center;
            padding: 18px 24px;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }
        .container { max-width: 960px; margin: 40px auto; padding: 0 24px; }
        .cards { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
        .card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.09);
            flex: 1 1 260px;
            max-width: 300px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.13);
        }
        .card-top { height: 6px; }
        .card-body { padding: 24px 22px 28px; }
        .card-icon { font-size: 28px; margin-bottom: 12px; }
        .card-title { font-size: 17px; font-weight: 700; color: #1a3a5c; margin-bottom: 8px; }
        .card-desc { font-size: 13px; color: #666; line-height: 1.5; }
        footer {
            text-align: center;
            padding: 32px 24px 24px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="banner">
        <img src="assets/hps-banner.jpg" alt="Harmony Public Schools Banner">
    </div>
    <div class="header-bar">
        Harmony Online &mdash; Instructional Design Dashboard
    </div>
    <div class="container">
        <div class="cards">
            <a class="card" href="a-courses.html">
                <div class="card-top" style="background:#2196f3;"></div>
                <div class="card-body">
                    <div class="card-icon">📘</div>
                    <div class="card-title">A Course Modules</div>
                    <div class="card-desc">Fall semester course module tracking</div>
                </div>
            </a>
            <a class="card" href="b-courses.html">
                <div class="card-top" style="background:#4caf50;"></div>
                <div class="card-body">
                    <div class="card-icon">📗</div>
                    <div class="card-title">B Course Modules</div>
                    <div class="card-desc">Spring semester course module tracking</div>
                </div>
            </a>
            <a class="card" href="token-usage.html">
                <div class="card-top" style="background:#ff9800;"></div>
                <div class="card-body">
                    <div class="card-icon">📊</div>
                    <div class="card-title">Token Usage</div>
                    <div class="card-desc">AI token spend tracker &amp; budget overview</div>
                </div>
            </a>
        </div>
    </div>
    <footer>Harmony Public Schools &middot; Instructional Design Team &middot; 2026</footer>
</body>
</html>
